plugins { id 'com.android.application' }

def signingEnv = [
    'ANDROID_KEYSTORE_FILE', 'ANDROID_KEYSTORE_PASSWORD',
    'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'
].collectEntries { name -> [(name): providers.environmentVariable(name).orNull] }
def signingEnabled = signingEnv.values().every { it != null && !it.isEmpty() }
if (!signingEnabled && (providers.gradleProperty('statusRequireSigning').isPresent() ||
        signingEnv.values().any { it != null && !it.isEmpty() })) {
    throw new GradleException('Assinatura incompleta. Configure todas as variáveis ANDROID_KEYSTORE_* e ANDROID_KEY_*.')
}

android {
    namespace 'com.toxic.whatssaver'
    compileSdk 36
    buildToolsVersion '35.0.0'
    buildFeatures { buildConfig true }
    bundle { language { enableSplit = false } }
    defaultConfig {
        applicationId 'com.toxic.whatssaver'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.3'
        testInstrumentationRunner 'com.toxic.whatssaver.SmokeInstrumentation'
    }
    signingConfigs {
        if (signingEnabled) {
            release {
                storeFile file(signingEnv.ANDROID_KEYSTORE_FILE)
                storeType 'JKS'
                storePassword signingEnv.ANDROID_KEYSTORE_PASSWORD
                keyAlias signingEnv.ANDROID_KEY_ALIAS
                keyPassword signingEnv.ANDROID_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            if (signingEnabled) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
}
