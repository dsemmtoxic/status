name: Validar Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Compilar e executar lint
        run: bash gradlew --no-daemon :app:assembleDebug :app:lintDebug
